    <script>
        $(function () {
            $('#expire_date').datepicker();

            const fields = [
                { element: document.getElementById('name'), message: 'Please enter a product name.' },
                { element: document.getElementById('description'), message: 'Please enter a description.' },
                { element: document.getElementById('category'), message: 'Please select a category.' },
                { element: document.getElementById('expire_date'), message: 'Please enter an expiration date.' },
                { element: document.getElementById('stock'), message: 'Please enter the units in stock.' },
                { element: document.getElementById('fileInput'), message: 'Please upload a product image.' }
            ];

            function validateField(field) {
                const isValid = field.element.type === 'file'
                    ? field.element.files.length > 0
                    : field.element.value.trim() !== '';
                const error = document.getElementById(field.element.id + '-error');

                error.textContent = isValid ? '' : field.message;
                error.classList.toggle('is-visible', !isValid);
                field.element.classList.toggle('is-invalid', !isValid);
                field.element.setAttribute('aria-invalid', String(!isValid));
                return isValid;
            }

            fields.forEach(function (field) {
                field.element.addEventListener(field.element.type === 'file' || field.element.tagName === 'SELECT' ? 'change' : 'input', function () {
                    validateField(field);
                });
            });

            document.getElementById('productForm').addEventListener('submit', function (event) {
                const invalidFields = fields.filter(function (field) {
                    return !validateField(field);
                });

                if (invalidFields.length > 0) {
                    event.preventDefault();
                    const firstInvalid = invalidFields[0].element;
                    (firstInvalid.type === 'file' ? document.getElementById('uploadButton') : firstInvalid).focus();
                    return;
                }

                event.preventDefault();
                window.alert('Product successfully added!');
                this.reset();
                $('#expire_date').datepicker('setDate', null);
                fields.forEach(function (field) {
                    const error = document.getElementById(field.element.id + '-error');
                    error.textContent = '';
                    error.classList.remove('is-visible');
                    field.element.classList.remove('is-invalid');
                    field.element.removeAttribute('aria-invalid');
                });
            });
        });
    </script>
